function init() { q = [...data].sort(()=>Math.random()-0.5); idx=0; draw(); }
function draw() {

    document.getElementById('yomi').innerText = item.y;
    document.getElementById('ans').style.display = 'none';
    document.getElementById('btn-s').style.display = 'block';
    document.getElementById('btn-n').style.display = 'none';
}
function show() {
    document.getElementById('ans').style.display = 'block';

}
