        .progress { text-align: center; font-size: 1.1rem; color: #555; font-weight: bold; margin-bottom: 15px; }
        .card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height: 380px; display: flex; flex-direction: column; justify-content: center; text-align: center; }

        .meaning-text { font-size: 1rem; line-height: 1.5; color: #333; margin-bottom: 20px; min-height: 3em; display: flex; align-items: center; justify-content: center; }

        .answer-area { margin-top: 15px; min-height: 100px; }
        .answer-word { font-size: 2.5rem; color: var(--accent); font-weight: bold; display: none; }
        .answer-yomi { font-size: 1rem; color: #777; display: block; font-weight: normal; margin-bottom: 5px; }
        .footer-btns { margin-top: 25px; }
        button { width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-show { background: var(--primary); color: white; }
        .btn-next { background: #2ecc71; color: white; display: none; }
        button:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>

    function initQuiz() {
        quizList = [...masterData];
        // Fisher-Yatesシャッフル
        for (let i = quizList.length - 1; i > 0; i--) {
            const r = Math.floor(Math.random() * (i + 1));
            [quizList[i], quizList[r]] = [quizList[r], quizList[i]];
        }
        currentIdx = 0;
        showQuestion();
    }

    function showQuestion() {
        const item = quizList[currentIdx];
        document.getElementById('progress').innerText = `${currentIdx + 1} / ${quizList.length}`;
        document.getElementById('meaning').innerText = item.m;
        document.getElementById('sentence').innerHTML = item.s ? item.s.replace("□", "<span>____</span>") : "（例文準備中）";
        
        document.getElementById('word').innerText = item.w;
        document.getElementById('yomi').innerText = item.y;
        
        document.getElementById('answer').style.display = 'none';
        document.getElementById('btn-show').style.display = 'block';
        document.getElementById('btn-next').style.display = 'none';
    }

        const item = quizList[currentIdx];
        if(item.s) {
            document.getElementById('sentence').innerHTML = item.s.replace("□", `<span style="color:var(--accent);">${item.w}</span>`);
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizList.length) {
            showQuestion();
        } else {
            alert("追加統合編、全問終了です！お疲れ様でした。シャッフルして再開します。");
            initQuiz();
        }
    }

    initQuiz();
</script>
</body>
</html>
